<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SRXMDL Radio</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080c;
      --bg-glow: #12151f;
      --paper: #f4f0e8;
      --paper-dark: #e8e2d6;
      --ink: #14161c;
      --ink-muted: #5c5f6b;
      --accent: #0a84ff;
      --live: #1a9b4a;
      --wait: #c48400;
      --fail: #c0392b;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(10, 132, 255, 0.12), transparent 40%),
        radial-gradient(circle at 85% 10%, rgba(48, 209, 88, 0.08), transparent 35%),
        linear-gradient(180deg, var(--bg-glow), var(--bg));
      color: #eef1f8;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    .masthead {
      margin-bottom: 22px;
    }

    .masthead h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }

    .masthead p {
      margin: 6px 0 0;
      color: #8b93a7;
      font-size: 0.92rem;
    }

    .receipt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .receipt {
      background: var(--paper);
      color: var(--ink);
      border: 1px solid #d8d2c6;
      box-shadow: 0 14px 28px var(--shadow);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .receipt::before,
    .receipt::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      height: 1px;
      border-top: 2px dashed #c9c2b4;
    }

    .receipt::before { top: 8px; }
    .receipt::after { bottom: 8px; }

    .receipt-top {
      padding: 18px 16px 12px;
      text-align: center;
      border-bottom: 1px dashed #cfc8ba;
    }

    .receipt-art {
      width: 120px;
      height: 120px;
      margin: 0 auto 10px;
      background: var(--paper-dark);
      border: 2px solid #d8d2c6;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .receipt-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .receipt-art .placeholder {
      font-size: 2rem;
      opacity: 0.35;
    }

    .receipt-meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .receipt-body {
      padding: 12px 16px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .receipt-body h2 {
      margin: 6px 0 4px;
      font-size: 1rem;
      line-height: 1.25;
      font-weight: 700;
    }

    .receipt-track {
      margin: 0;
      font-size: 0.82rem;
      color: var(--ink-muted);
      line-height: 1.45;
      min-height: 1.2em;
    }

    .receipt-show {
      margin: 0 0 6px;
      font-size: 0.78rem;
      color: var(--ink);
      font-weight: 600;
    }

    .receipt-np {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }

    .np-thumb {
      width: 36px;
      height: 36px;
      border: 1px solid #cfc8ba;
      background: var(--paper-dark);
      flex-shrink: 0;
      overflow: hidden;
    }

    .np-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tag-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 6px;
    }

    .tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.58rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 6px;
      border: 1px solid #cfc8ba;
      color: var(--ink-muted);
    }

    .receipt-divider {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem;
      color: #a59d8d;
      text-align: center;
      margin: 10px 0;
      letter-spacing: 0.12em;
    }

    .badge {
      display: inline-block;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border: 1px solid currentColor;
      margin-top: 6px;
    }

    .badge.ready { color: var(--live); }
    .badge.waiting { color: var(--wait); }
    .badge.failed { color: var(--fail); }

    .receipt-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: auto;
    }

    .receipt-actions button {
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 9px 8px;
      border: 1px solid #cfc8ba;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    .receipt-actions button.primary {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    .receipt-actions button:hover {
      filter: brightness(0.97);
    }

    .player-ticket {
      background: var(--paper);
      color: var(--ink);
      border: 1px solid #d8d2c6;
      box-shadow: 0 18px 36px var(--shadow);
      padding: 18px;
    }

    .player-head {
      display: flex;
      gap: 16px;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px dashed #cfc8ba;
      margin-bottom: 14px;
    }

    .player-head .receipt-art {
      width: 88px;
      height: 88px;
      margin: 0;
      flex-shrink: 0;
    }

    .player-head h2 {
      margin: 0 0 4px;
      font-size: 1.1rem;
    }

    .player-head p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--ink-muted);
    }

    .player-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .player-controls button,
    .player-controls select {
      font: inherit;
      font-size: 0.85rem;
      padding: 10px 14px;
      border: 1px solid #cfc8ba;
      background: #fff;
      color: var(--ink);
    }

    .player-controls button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      font-weight: 600;
    }

    .player-controls select {
      flex: 1;
      min-width: 200px;
    }

    video {
      width: 100%;
      max-height: 52vh;
      background: #000;
      border: 2px solid #d8d2c6;
    }

    .status {
      margin-top: 10px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      color: var(--ink-muted);
      min-height: 1.2em;
    }

    .empty-note {
      grid-column: 1 / -1;
      text-align: center;
      color: #8b93a7;
      font-size: 0.9rem;
      padding: 24px;
      border: 1px dashed #2a3040;
    }

    @media (max-width: 640px) {
      .receipt-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .receipt-art {
        width: 100%;
        height: auto;
        aspect-ratio: 1;
      }

      .player-head {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>SRXMDL Local Radio</h1>
      <p>Square tickets with channel logo, number, show, and now playing.</p>
    </header>

    <div id="channelGrid" class="receipt-grid"></div>

    <section class="player-ticket">
      <div class="player-head" id="playerHead">
        <div class="receipt-art" id="playerArt">
          <span class="placeholder">♪</span>
        </div>
        <div>
          <div class="receipt-meta" id="playerMeta">NOW PLAYING</div>
          <h2 id="playerTitle">Select a channel</h2>
          <p id="playerSubtitle">Pick a receipt above or use the source list below</p>
        </div>
      </div>

      <div class="player-controls">
        <select id="sourceSelect" aria-label="All sources"></select>
        <button id="playBtn" type="button" class="primary">Play</button>
        <button id="stopBtn" type="button">Stop</button>
        <button id="copyBtn" type="button">Copy URL</button>
      </div>
      <video id="player" controls playsinline></video>
      <div class="status" id="status"></div>
    </section>
  </div>

  <script>
    const sourceSelect = document.getElementById('sourceSelect');
    const channelGrid = document.getElementById('channelGrid');
    const player = document.getElementById('player');
    const statusEl = document.getElementById('status');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const copyBtn = document.getElementById('copyBtn');
    const playerArt = document.getElementById('playerArt');
    const playerTitle = document.getElementById('playerTitle');
    const playerSubtitle = document.getElementById('playerSubtitle');
    const playerMeta = document.getElementById('playerMeta');

    let hls = null;
    let catalog = { channels: [], captures: [] };
    let activeArtUrl = null;

    function setStatus(text) {
      statusEl.textContent = text || '';
    }

    function selectedOption() {
      return sourceSelect.options[sourceSelect.selectedIndex];
    }

    function destroyHls() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
    }

    function stopPlayback() {
      destroyHls();
      player.removeAttribute('src');
      player.load();
      setStatus('Stopped.');
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    function badgeClass(state) {
      if (state === 'Ready') return 'ready';
      if (state === 'Failed' || state === 'Stale') return 'failed';
      return 'waiting';
    }

    function channelDisplayImage(channel) {
      return channel.displayImageUrl ||
        channel.channelTileUrl ||
        channel.channelLogoUrl ||
        channel.showImageUrl ||
        channel.nowPlayingImageUrl ||
        null;
    }

    function channelNumberLabel(channel) {
      if (channel.channelNumber) return `CH ${channel.channelNumber}`;
      if (channel.channelNumberCanonical) return `CH ${channel.channelNumberCanonical}`;
      return 'LIVE';
    }

    function channelMetaLabel(channel) {
      const parts = [channelNumberLabel(channel)];
      if (channel.channelNumberCanonical &&
          channel.channelNumber &&
          channel.channelNumberCanonical !== channel.channelNumber) {
        parts.push(`#${channel.channelNumberCanonical}`);
      }
      if (channel.isPlayByPlay) parts.push('PXP');
      return parts.join(' · ');
    }

    function nowPlayingText(channel) {
      if (channel.trackName) {
        const artist = channel.artistName ? channel.artistName + ' — ' : '';
        return artist + channel.trackName;
      }
      return 'No track info yet';
    }

    function artBlock(imageUrl, label) {
      if (imageUrl) {
        return `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(label || 'Art')}" loading="lazy" />`;
      }
      return '<span class="placeholder">♪</span>';
    }

    function setPlayerHeader(title, subtitle, imageUrl, metaText) {
      playerTitle.textContent = title || 'Select a channel';
      playerSubtitle.textContent = subtitle || '';
      playerMeta.textContent = metaText || 'NOW PLAYING';
      playerArt.innerHTML = artBlock(imageUrl, title);
      activeArtUrl = imageUrl || null;
    }

    async function playUrl(url, channel) {
      const title = channel?.channelName || 'Stream';
      const subtitle = channel?.showName
        ? `${channel.showName}${channel.trackName ? ' · ' + nowPlayingText(channel) : ''}`
        : nowPlayingText(channel);
      const imageUrl = channel ? channelDisplayImage(channel) : null;
      setPlayerHeader(title, subtitle, imageUrl, channel ? channelMetaLabel(channel) : 'STREAM');
      setStatus('Loading…');
      destroyHls();
      player.removeAttribute('src');

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(url);
        hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED, async () => {
          try {
            await player.play();
            setStatus('Playing.');
          } catch {
            setStatus('Autoplay blocked — press play on the video.');
          }
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) setStatus('HLS error: ' + (data.details || data.type));
        });
        return;
      }

      if (player.canPlayType('application/vnd.apple.mpegurl')) {
        player.src = url;
        try {
          await player.play();
          setStatus('Playing.');
        } catch (err) {
          setStatus('Play failed: ' + err.message);
        }
        return;
      }

      setStatus('HLS not supported in this browser.');
    }

    async function playSelected() {
      const opt = selectedOption();
      if (!opt || !opt.value) {
        setStatus('No source selected.');
        return;
      }

      const type = opt.dataset.type || 'hls';
      if (type === 'mp4') {
        setPlayerHeader(opt.dataset.title, opt.dataset.artist, opt.dataset.image || null, 'CAPTURE');
        destroyHls();
        player.src = opt.value;
        try {
          await player.play();
          setStatus('Playing MP4.');
        } catch (err) {
          setStatus('MP4 play failed: ' + err.message);
        }
        return;
      }

      const channel = {
        channelName: opt.dataset.title,
        channelNumber: opt.dataset.channelNumber,
        channelNumberCanonical: opt.dataset.channelCanonical,
        showName: opt.dataset.show,
        trackName: opt.dataset.track,
        artistName: opt.dataset.artistOnly,
        isPlayByPlay: opt.dataset.pxp === '1',
        channelTileUrl: opt.dataset.tile,
        channelLogoUrl: opt.dataset.logo,
        showImageUrl: opt.dataset.showImage,
        nowPlayingImageUrl: opt.dataset.npImage,
        displayImageUrl: opt.dataset.displayImage
      };
      await playUrl(opt.value, channel);
    }

    function rebuildChannelGrid(channels) {
      channelGrid.innerHTML = '';
      if (!channels.length) {
        channelGrid.innerHTML = '<div class="empty-note">No live channels yet — tune radio in SRXMDL or add a channel ID.</div>';
        return;
      }

      for (const channel of channels) {
        const card = document.createElement('article');
        card.className = 'receipt';
        const mainArt = channel.channelTileUrl || channel.channelLogoUrl || channel.displayImageUrl;
        const npArt = channel.nowPlayingImageUrl;
        const showNpThumb = npArt && npArt !== mainArt;
        card.innerHTML = `
          <div class="receipt-top">
            <div class="receipt-art">${artBlock(mainArt, channel.channelName)}</div>
            <div class="receipt-meta">${escapeHtml(channelMetaLabel(channel))} · ${escapeHtml(new Date(channel.updatedUtc || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}</div>
            <span class="badge ${badgeClass(channel.state)}">${escapeHtml(channel.state)}</span>
          </div>
          <div class="receipt-body">
            <h2>${escapeHtml(channel.channelName || 'Live Channel')}</h2>
            ${channel.showName ? `<p class="receipt-show">${escapeHtml(channel.showName)}</p>` : ''}
            <div class="receipt-np">
              ${showNpThumb ? `<div class="np-thumb">${artBlock(npArt, 'Now playing')}</div>` : ''}
              <p class="receipt-track">${escapeHtml(nowPlayingText(channel))}</p>
            </div>
            <div class="tag-row">
              ${channel.isPlayByPlay ? '<span class="tag">Play-by-play</span>' : ''}
              ${channel.channelLogoUrl ? '<span class="tag">Logo</span>' : ''}
            </div>
            <div class="receipt-divider">- - - - - - - - - -</div>
            <div class="receipt-actions">
              <button type="button" class="primary" data-play>Play</button>
              <button type="button" data-copy>Copy URL</button>
            </div>
          </div>
        `;

        card.querySelector('[data-play]').addEventListener('click', () => playUrl(channel.streamUrl, channel));
        card.querySelector('[data-copy]').addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(channel.streamUrl);
            setStatus('Copied ' + channel.channelName + '.');
          } catch {
            setStatus('Copy failed.');
          }
        });
        channelGrid.appendChild(card);
      }
    }

    function rebuildOptions(data) {
      catalog = data;
      sourceSelect.innerHTML = '';

      for (const channel of data.channels || []) {
        const opt = document.createElement('option');
        opt.value = channel.streamUrl;
        opt.dataset.type = 'hls';
        opt.dataset.title = channel.channelName || 'Live channel';
        opt.dataset.show = channel.showName || '';
        opt.dataset.track = channel.trackName || '';
        opt.dataset.artistOnly = channel.artistName || '';
        opt.dataset.channelNumber = channel.channelNumber || '';
        opt.dataset.channelCanonical = channel.channelNumberCanonical || '';
        opt.dataset.pxp = channel.isPlayByPlay ? '1' : '0';
        opt.dataset.tile = channel.channelTileUrl || '';
        opt.dataset.logo = channel.channelLogoUrl || '';
        opt.dataset.showImage = channel.showImageUrl || '';
        opt.dataset.npImage = channel.nowPlayingImageUrl || '';
        opt.dataset.displayImage = channel.displayImageUrl || '';
        const ch = channel.channelNumber ? ` ch ${channel.channelNumber}` : '';
        opt.textContent = `${channel.channelName}${ch} [${channel.state}]`;
        sourceSelect.appendChild(opt);
      }

      for (const item of data.captures || []) {
        const opt = document.createElement('option');
        opt.value = item.proxyUrl.startsWith('http') ? item.proxyUrl : new URL(item.proxyUrl, window.location.origin).href;
        opt.dataset.type = (item.streamType || '').toLowerCase() === 'mp4' ? 'mp4' : 'hls';
        opt.dataset.title = item.trackName || 'Captured stream';
        opt.dataset.artist = item.artistName || '';
        opt.dataset.image = item.imageUrl || '';
        opt.textContent = `${item.trackName} — ${item.artistName} (${item.streamType})`;
        sourceSelect.appendChild(opt);
      }

      if (sourceSelect.options.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No streams available yet';
        sourceSelect.appendChild(opt);
      }

      rebuildChannelGrid(data.channels || []);

      const currentTitle = playerTitle.textContent;
      const currentChannel = (data.channels || []).find(c => c.channelName === currentTitle);
      if (currentChannel) {
        setPlayerHeader(
          currentChannel.channelName,
          currentChannel.showName
            ? `${currentChannel.showName}${currentChannel.trackName ? ' · ' + nowPlayingText(currentChannel) : ''}`
            : nowPlayingText(currentChannel),
          channelDisplayImage(currentChannel),
          channelMetaLabel(currentChannel));
      }
    }

    async function refreshCatalog() {
      try {
        const res = await fetch('/api/channels');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        rebuildOptions(data);
      } catch (err) {
        setStatus('Could not load channels: ' + err.message);
      }
    }

    playBtn.addEventListener('click', playSelected);
    stopBtn.addEventListener('click', stopPlayback);
    copyBtn.addEventListener('click', async () => {
      const opt = selectedOption();
      if (!opt?.value) return;
      try {
        await navigator.clipboard.writeText(opt.value);
        setStatus('Copied stream URL.');
      } catch {
        setStatus('Copy failed.');
      }
    });

    refreshCatalog();
    setInterval(refreshCatalog, 8000);
  </script>
</body>
</html>
